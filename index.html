<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>TODO</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <!-- Template -->
    <div id="templates">
      <li id="list-template" class="list">
        <span id="list-title-template" class="list-title" contenteditable="true">New List</span>
        <ul id="list-content-template" class="list-content">
          <li id="list-item-template" class="list-item">
            <span contenteditable="true">New Item</span>
          </li>
          <button class="add-list-item">
            <span class="material-icons">add</span>
            Add Item
          </button>
          <button class="add-list">
            <span class="material-icons">add</span>
            Add List
          </button>
        </ul>
      </li>
      <button id="button-add-list-toplevel-template" class="add-list toplevel">
        <span class="material-icons">add</span>
        Add List
      </button>
    </div>

    <!-- Main list -->
    <div id="main">
      <span style="display: none;">__main__</span>
      <ul id="lists">
        <button class="add-list toplevel">
          <span class="material-icons">add</span>
          Add List
        </button>
      </ul>
    </div>

    <!-- Other -->
    <div id="buttons">
      <button id="save">
        <span class="material-icons">file_download</span>
        Save
      </button>
      <button id="load">
        <span class="material-icons">file_upload</span>
        Load
      </button>
    </div>
    <div id="form">
      <label for="fname">Save as:</label>
      <input type="text" id="fname" />
    </div>
    <input type="file" id="fload" style="display: none;" />

    <script src="jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
